'},{text:"Not until the final results were announced did investors regain confidence in the market.",grammar:'"Not until" inversion — emphasis on the delayed moment of change'},{text:"So rapidly has the technology developed that regulators have struggled to keep pace.",grammar:'"So + adverb" inversion — "so rapidly has" triggers subject-auxiliary inversion + result clause',band:8},{text:"Little did the researchers anticipate that their findings would generate such widespread controversy.",grammar:'"Little" inversion — "little did...anticipate" stresses the unexpectedness of the outcome'}]},{id:"reported",name:"Reported Speech",icon:"💬",sentences:[{text:"The minister announced that the proposed reforms would be implemented in stages over the following year.",grammar:'Backshift: "will" → "would"; "next" → "the following" — standard reported speech shifts'},{text:"Scientists warned that unless immediate action was taken, the damage would prove irreversible.",grammar:'Reported conditional — "is taken" → "was taken"; "will prove" → "would prove"'},{text:"The spokesperson confirmed that the investigation had been ongoing for several months.",grammar:'Backshift to past perfect — "has been" → "had been" in reported speech'},{text:"Analysts predicted that the economic recovery would take longer than had initially been anticipated.",grammar:'Embedded past perfect passive in reported prediction — "had...been anticipated"',band:8},{text:"The committee acknowledged that insufficient attention had been paid to the needs of rural communities.",grammar:"Reported acknowledgement with past perfect passive — formal academic register"},{text:"Critics argued that the policy had been poorly designed and was unlikely to achieve its stated objectives.",grammar:'Two backshifted clauses — "has been designed" → "had been designed"; "is" → "was"'},{text:"Researchers suggested that the findings should be interpreted with considerable caution.",grammar:'"Should" does not backshift — modal suggestion is retained unchanged in reported speech'},{text:"The report concluded that further investment would be required if the targets were to be met.",grammar:'Reported conclusion with embedded formal conditional — "were to be met"',band:8},{text:"Officials stated that the negotiations had reached a critical stage and that a breakthrough was imminent.",grammar:'Two parallel "that" clauses — same reporting verb governs both subordinate clauses'},{text:"Experts cautioned that the technology, while promising, had yet to be tested at scale.",grammar:'"Had yet to be tested" — past perfect passive expressing an unfulfilled requirement'}]},{id:"cleft",name:"Cleft Sentences",icon:"✂️",sentences:[{text:"It is the lack of affordable housing that has driven many young people out of the city.",grammar:'"It is...that" cleft — focuses emphasis on "the lack of affordable housing" as the key cause'},{text:"What the data clearly demonstrates is that inequality has widened significantly over the past two decades.",grammar:'"What...is" pseudo-cleft — noun clause subject + "is" + that-clause predicate',band:8},{text:"It was not until the industrial revolution that the pace of urbanisation began to accelerate dramatically.",grammar:'"It was not until...that" cleft — emphasises the turning point in time'},{text:"What the government has failed to recognise is the long-term cost of underinvesting in education.",grammar:`"What...is" pseudo-cleft — moves focus to the government's critical oversight`,band:7},{text:"It is through international cooperation that the most pressing environmental challenges can be addressed.",grammar:'"It is...that" cleft with prepositional phrase — emphasises the means or method',band:8},{text:"What distinguishes this approach from previous attempts is its emphasis on community-led solutions.",grammar:'"What...is" cleft — subject is a "what" clause; predicate is a noun phrase'},{text:"It is the wealthiest nations that bear the greatest responsibility for reducing carbon emissions.",grammar:'"It is...that" cleft — redirects focus to the agent bearing primary responsibility'},{text:"What the research consistently shows is that early intervention yields the most significant long-term benefits.",grammar:'"What...is that" cleft — links a generalised finding to a specific conclusion'},{text:"It was only after considerable public pressure that the authorities agreed to review the decision.",grammar:'"It was only...that" cleft — "only" adds restrictive emphasis to the triggering condition'},{text:"What makes this period particularly significant is the unprecedented convergence of social and economic disruption.",grammar:'"What...is" cleft — "what makes" clause as subject + noun phrase as predicate'}]}],Kl=[{id:"line-graphs",name:"Line Graphs",icon:"📈",sentences:[{text:"The line graph illustrates the changes in energy consumption across five countries between 1990 and 2020.",grammar:'Standard opening — "illustrates the changes in [topic] across [subjects] between [years]"'},{text:"Overall, it is evident that oil usage experienced a dramatic surge, while renewable energy climbed steadily throughout the period.",grammar:'Overview sentence — contrasts two trends using "while"; "dramatic surge" vs "climbed steadily"'},{text:"France consistently outperformed Germany throughout the period, with the gap widening particularly after 2005.",grammar:'"consistently outperformed...throughout the period" — adverb + verb collocation for sustained comparison'},{text:"Having peaked at 45 million in 2010, the figure subsequently plummeted to just 28 million by the end of the period.",grammar:'Participle clause — "having peaked at" introduces a past high point before describing a decline',band:7},{text:"The proportion of users accessing the internet via mobile devices rose exponentially from 2008 onwards.",grammar:'"rose exponentially from [year] onwards" — strong upward trend with a clear starting point'},{text:"Both categories fluctuated considerably during the early years before levelling off at approximately 30% in 2015.",grammar:'"fluctuated considerably...before levelling off at" — two-phase trend in one sentence'},{text:"By far the most striking feature is the sharp decline in coal consumption, which nearly halved over the two-decade period.",grammar:'"By far the most striking feature is" — strong superlative opener for highlighting a key trend',band:8},{text:"The figures for urban and rural populations converged significantly, reaching an almost identical level by 2018.",grammar:'"converged significantly" — useful for describing two lines approaching each other'},{text:"After remaining stable throughout most of the 1990s, sales began to climb steadily from 2001 onwards.",grammar:'Adverbial opener — "After [verb+ing]" introduces a stable period before a change begins'},{text:"In contrast to the UK, where usage dropped significantly, Germany witnessed a sharp increase over the same period.",grammar:'"In contrast to [X], where [change], [Y] witnessed" — embedded relative clause for direct contrast',band:7}]},{id:"bar-charts",name:"Bar Charts",icon:"📊",sentences:[{text:"The bar chart compares the proportion of household income spent on food and leisure across six European countries in 2019.",grammar:'Standard opening — "compares [what is measured] across [categories] in [year]"'},{text:"Overall, the United Kingdom recorded the highest figure by a considerable margin, while Poland showed the lowest across all categories.",grammar:'Overview — "by a considerable margin" strengthens the superlative; "across all categories" generalises the finding'},{text:"At 45%, transport costs in Japan significantly outstripped those in all other countries surveyed.",grammar:'"outstripped those in all other countries surveyed" — strong comparison collocation; figure leads the sentence',band:7},{text:"Healthcare spending in the United States dwarfed all other categories, standing at approximately three times the global average.",grammar:'"dwarfed all other categories" — vivid verb for dominance; "standing at" introduces the supporting figure',band:8},{text:"While the figures for Germany and France exhibit a marginal difference, both countries considerably outpace their eastern European counterparts.",grammar:'"exhibit a marginal difference" — for near-equal bars; "outpace their counterparts" for group comparison'},{text:"The proportion allocated to education ranked highest in South Korea, accounting for the largest share at nearly 18%.",grammar:'"ranked highest in [country], accounting for the largest share at [figure]" — two-part description of a top bar'},{text:"There is a stark contrast between developed and developing nations, with the former spending nearly double the latter on infrastructure.",grammar:'"stark contrast...with the former...the latter" — formal comparison using "former/latter" avoids repetition',band:7},{text:"With the exception of Japan, all countries surveyed showed a broadly similar pattern of expenditure across the five categories.",grammar:'"With the exception of [X], all [subjects] showed a broadly similar pattern" — generalisation with one outlier'},{text:"Technology exports from China more than doubled between 2010 and 2020, causing it to overtake the United States for the first time.",grammar:'"more than doubled...causing it to overtake" — cause-and-effect structure linking a trend to its consequence'},{text:"The gap between the highest and lowest performing nations was particularly pronounced in the healthcare and education sectors.",grammar:'"the gap...was particularly pronounced in" — highlights where a disparity is most significant'}]},{id:"pie-charts",name:"Pie Charts",icon:"🥧",sentences:[{text:"The pie charts illustrate the breakdown of household energy consumption in Germany in 1990 and 2020.",grammar:'Standard opening — "illustrate the breakdown of [topic] in [place] in [years]"'},{text:"Overall, heating accounted for the largest proportion in both years, while electricity constituted the smallest share.",grammar:'Overview — "accounted for the largest proportion" vs "constituted the smallest share" for two extremes'},{text:"Transport claimed the lion's share of government expenditure, accounting for well over a third of the total budget.",grammar:`"claimed the lion's share" — idiomatic phrase for dominant category; "well over a third" avoids exact figures`,band:8},{text:"Food and clothing collectively accounted for approximately two-fifths of total household spending in the base year.",grammar:'"collectively accounted for approximately two-fifths" — groups categories together using a fraction'},{text:"At a mere 4%, expenditure on culture and recreation remained only a fraction of that spent on housing.",grammar:'"At a mere [%]" — "mere" emphasises smallness; "only a fraction of" compares proportionally'},{text:"The distribution is heavily skewed towards service industries, which jointly represented over 60% of the national economy.",grammar:'"heavily skewed towards" — strong descriptor for uneven distribution; "jointly represented" groups subcategories',band:7},{text:"Manufacturing and agriculture, comprising approximately 15% and 8% respectively, saw their combined share decline sharply by 2020.",grammar:'"comprising [X]% and [Y]% respectively" — precise multi-item description using a single relative clause'},{text:"The share attributed to renewable energy was more than double that recorded a decade earlier, rising from 12% to 25%.",grammar:'"more than double that recorded" — elegant comparative without repeating the noun; "rising from X to Y" adds precision'},{text:"With the notable exception of Asia, all other regions showed a broadly comparable distribution of trade activity.",grammar:'"With the notable exception of" — stronger than "except for"; signals an outlier before a generalisation'},{text:"Spending on defence, at approximately one-fifth of the total, considerably outweighed investment in social welfare programmes.",grammar:'Parenthetical figure — ", at approximately one-fifth," embedded mid-sentence for fluency'}]},{id:"maps",name:"Maps",icon:"🗺️",sentences:[{text:"The maps illustrate how the coastal town of Bradfield has transformed over a fifty-year period from 1970 to 2020.",grammar:'Standard opening — "illustrate how [place] has transformed over [period] from [year] to [year]"'},{text:"Overall, the area underwent substantial development, with the farmland to the north being replaced by a residential zone.",grammar:'Overview — "underwent substantial development" is the main claim; "with [noun] being replaced" adds supporting detail',band:7},{text:"The factory situated in the northern corner was demolished and replaced by a modern shopping centre.",grammar:'"situated in the [direction] corner was demolished and replaced by" — location + transformation in one sentence'},{text:"A dual carriageway running through the centre of town was constructed, significantly improving connectivity across the region.",grammar:'Participial phrase — "running through" locates the road; "significantly improving" shows the result'},{text:"The woodland adjacent to the river was removed to make way for a new leisure complex and car park.",grammar:'"adjacent to [feature] was removed to make way for" — reason clause explains the demolition'},{text:"The school building, originally located opposite the town hall, was extended considerably during the later period.",grammar:'Embedded clause — ", originally located opposite [landmark]," gives prior position before describing the change'},{text:"Several residential properties on both sides of the main road were converted into commercial premises between 1990 and 2020.",grammar:'"on both sides of" — useful spatial phrase; "converted into" for change of use rather than demolition'},{text:"The harbour, which had previously remained unchanged since its construction, was expanded and upgraded during the later period.",grammar:'"which had previously remained unchanged since its construction" — relative clause contrasts past stability with present change',band:8},{text:"A pedestrian walkway was developed along the northern bank, connecting the old town to the newly built cultural centre.",grammar:'"developed along the [direction] bank, connecting" — location + participial result clause'},{text:"The industrial zone to the east of the railway line was relocated and transformed into a public park and recreation area.",grammar:'"to the east of the railway line was relocated and transformed into" — compass direction + double transformation verb'}]},{id:"process-diagrams",name:"Process Diagrams",icon:"⚙️",sentences:[{text:"The diagram illustrates the process by which raw coffee beans are transformed into the finished product ready for retail sale.",grammar:'Standard opening — "illustrates the process by which [input] is transformed into [output]"'},{text:"Overall, the process comprises seven distinct stages, commencing with the harvesting of ripe berries and culminating in packaging.",grammar:'Overview — "comprises [N] distinct stages, commencing with...and culminating in" covers start to finish in one sentence'},{text:"Once the outer casing has been removed, the beans are subjected to a thorough washing process to eliminate impurities.",grammar:'"Once [present perfect passive], [subject] is subjected to" — temporal clause + complex passive for sequential steps'},{text:"In the penultimate stage, the dried beans undergo roasting at temperatures exceeding 200 degrees, thereby altering their chemical composition.",grammar:'"In the penultimate stage...undergo...thereby [verb+ing]" — position marker + cause-and-effect ending',band:8},{text:"Prior to fermentation, the harvested grapes are passed through a mechanical press to extract the juice from the pulp.",grammar:'"Prior to [noun], [subject] is passed through" — formal temporal preposition for ordering steps'},{text:"The mixture is then transferred to a series of heated chambers, where it is left to mature for a minimum of six weeks.",grammar:'"transferred to...where it is left to [verb] for" — movement + duration embedded in a relative clause'},{text:"At this juncture, the material is meticulously inspected for defects before being passed on to the next stage of production.",grammar:'"At this juncture" — formal discourse marker; "meticulously inspected" raises register',band:8},{text:"The recycled material is converted into small pellets, which are subsequently melted and moulded into new plastic containers.",grammar:'"converted into...which are subsequently melted and moulded" — two-step chain using a relative clause'},{text:"The water is first filtered to remove solid particles, then treated with chemicals to eliminate any remaining bacterial contamination.",grammar:'"first...then" — simplest sequencing pair; two parallel passive infinitive clauses'},{text:"Once processing is complete, the final product is packaged, labelled, and dispatched to distribution centres across the country.",grammar:'"Once [noun] is complete, [subject] is [verb], [verb], and [verb]" — three-verb passive list for the final stage'}]},{id:"tables",name:"Tables",icon:"📋",sentences:[{text:"The table compares five countries across four socioeconomic indicators: GDP per capita, life expectancy, literacy rate, and unemployment.",grammar:'Standard opening — "compares [N] [subjects] across [N] indicators:" followed by a colon-introduced list'},{text:"Overall, Japan ranks highest in life expectancy and literacy, while Brazil records the lowest figures across most indicators.",grammar:'Overview — two extremes named explicitly; "across most indicators" avoids overstating a universal claim'},{text:"Norway consistently outperforms all other nations, with its GDP per capita standing at approximately twice the global average.",grammar:'"consistently outperforms all other nations" — strong superlative; "standing at approximately twice" adds a ratio'},{text:"The figures for literacy rate range from a high of 99% in South Korea to a low of 61% in Nigeria.",grammar:'"range from a high of [X] in [place] to a low of [Y] in [place]" — standard formula for showing spread',band:7},{text:"There is a marked disparity between developed and developing nations, particularly in the areas of healthcare spending and educational attainment.",grammar:'"marked disparity between...particularly in the areas of" — general claim followed by specific sectors'},{text:"With the exception of China, all Asian economies surveyed show a comparable level of export activity relative to GDP.",grammar:'"With the exception of [X], all [group] show a comparable level of [metric] relative to [benchmark]"'},{text:"Germany presents a striking contrast to its European neighbours, recording both the highest trade surplus and the lowest unemployment rate.",grammar:'"presents a striking contrast...recording both the highest...and the lowest" — double superlative for emphasis'},{text:"Life expectancy in the United States, at 78 years, lags considerably behind that of Japan, which stands at 84 years.",grammar:'Parenthetical figure — ", at [N] years," mid-sentence; "lags considerably behind that of" for a precise comparison'},{text:"The data reveals that countries with higher literacy rates consistently outperform those with lower rates in terms of economic productivity.",grammar:'"The data reveals that...consistently outperform those with lower rates in terms of" — analytical conclusion sentence'},{text:"Australia stands out as a notable outlier, achieving high scores across all four categories despite its relatively small population.",grammar:'"stands out as a notable outlier, achieving...despite" — concessive clause highlights an unexpected result',band:7}]},{id:"overviews",name:"Overviews",icon:"📝",sentences:[{text:"Overall, it is clear that renewable energy experienced the most significant growth, while coal consumption declined steadily throughout the period.",grammar:'"Overall, it is clear that [X], while [Y]" — standard two-trend overview for line graphs',band:7},{text:"In general, the proportion of spending on healthcare rose considerably, whereas education funding declined over the same timeframe.",grammar:'"In general...rose considerably, whereas...declined" — contrasting overview using "whereas"',band:7},{text:"Overall, the area underwent substantial transformation, with industrial land being replaced by residential zones, while the town centre remained largely unchanged.",grammar:'"Overall, the area underwent substantial transformation, with [X] being replaced, while [Y] remained" — map overview template',band:7},{text:"In summary, the wealthiest nations consistently recorded the highest figures across all indicators, with the gap between the highest and lowest widening over time.",grammar:'"In summary, [group] consistently recorded the highest figures across all indicators" — table overview formula',band:8},{text:"Overall, it is evident that the two countries followed markedly different trajectories, with one peaking early while the other rose steadily throughout.",grammar:'"markedly different trajectories" — strong comparative language for diverging trends',band:7},{text:"In general, manufacturing accounted for the dominant share in the earlier period, whereas services had become the largest sector by the end.",grammar:'"accounted for the dominant share...whereas [X] had become" — temporal shift in proportions for pie charts',band:7},{text:"Overall, the process is relatively straightforward, comprising six distinct stages from the initial raw material through to the finished consumer product.",grammar:'"comprising [N] distinct stages from [start] through to [end]" — process diagram overview',band:7},{text:"In summary, younger age groups represented the largest proportion of internet users, while those aged over 65 accounted for the smallest share.",grammar:'"represented the largest proportion...while [group] accounted for the smallest share" — bar/pie chart overview',band:7},{text:"Overall, there is a clear correlation between levels of urbanisation and economic output, with more developed nations consistently outperforming their counterparts.",grammar:'"a clear correlation between [X] and [Y]" — analytical overview language for table/chart comparisons',band:8},{text:"In general, both cities underwent considerable expansion, though the nature of development differed significantly between the northern and southern districts.",grammar:'"underwent considerable expansion, though the nature of development differed" — overview conceding similarity while noting divergence',band:7}]},{id:"discourse-markers",name:"Discourse Markers",icon:"🔗",sentences:[{text:"Furthermore, the data suggests that investment in renewable energy more than doubled over the course of the decade.",grammar:'"Furthermore" — additive marker introducing a supporting point; stronger than "also"',band:7},{text:"Nevertheless, it should be noted that these figures represent only a small fraction of total global expenditure.",grammar:'"Nevertheless" — concessive marker; acknowledges the main trend before qualifying it',band:7},{text:"In spite of this general upward trend, the figures for Japan remained consistently high throughout the entire period.",grammar:'"In spite of this [noun/adjective]" — prepositional concessive; introduces an exception to the pattern',band:7},{text:"As a consequence, the overall proportion of urban dwellers surpassed that of rural residents for the first time in recorded history.",grammar:'"As a consequence" — causal marker; shows result of a previously described change',band:7},{text:"In addition to this, the proportion allocated to transport infrastructure increased by approximately 15 percentage points between 2000 and 2020.",grammar:'"In addition to this" — additive marker; more formal than "also" or "and"',band:7},{text:"By contrast, the southern region experienced a marked decline, falling from 45% to just 28% over the same period.",grammar:'"By contrast" — direct comparison marker; introduces the opposite trend',band:7},{text:"Despite the overall growth trend, there were notable fluctuations during the middle years, particularly between 2008 and 2012.",grammar:'"Despite [noun phrase]" — concessive preposition; no comma needed before the main clause',band:7},{text:"Moreover, countries with higher levels of educational attainment consistently demonstrated stronger economic performance across all measured indicators.",grammar:'"Moreover" — additive emphatic; stronger than "furthermore"; introduces a particularly important point',band:8},{text:"On the other hand, developing nations showed a significantly different pattern, with expenditure on food comprising the largest proportion of household budgets.",grammar:'"On the other hand" — contrastive marker; used for direct comparison between two groups',band:7},{text:"As a result of this rapid urbanisation, green spaces in the town centre were almost entirely replaced by commercial and residential buildings.",grammar:'"As a result of [noun phrase]" — causal connector; note the noun phrase (not a clause) after "of"',band:7}]},{id:"approximation",name:"Approximation",icon:"≈",sentences:[{text:"The proportion rose to just under 40%, while the corresponding figure for the previous year stood at roughly 25%.",grammar:'"just under [X]%" and "roughly [Y]%" — two hedging expressions in one sentence for contrast',band:7},{text:"At approximately 3.5 million, the figure was slightly more than double that recorded at the start of the period.",grammar:'"At approximately [X]" opens the sentence; "slightly more than double" is a hedged ratio',band:7},{text:"Spending on healthcare accounted for around one-third of the total budget, compared to a mere 8% allocated to education.",grammar:'"around one-third" — fraction with hedging; "a mere 8%" uses "mere" to stress smallness',band:7},{text:"The two figures were broadly compar
